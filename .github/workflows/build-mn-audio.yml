name: Build Full Trung Bo MP3

on:
  push:
    branches: [feature/mn-prebuilt-mp3]
    paths:
      - '.github/workflows/build-mn-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mn-vi-audio-v1
  cancel-in-progress: false

env:
  AUDIO_TAG: mn-vi-audio-v1
  PIPER_VOICE: vi_VN-vais1000-medium

jobs:
  repair-and-publish:
    name: Repair MN113..MN120 and publish 152/152
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Piper, Vietnamese voice and FFmpeg
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts==1.7.0
          python -m piper.download_voices "$PIPER_VOICE"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Render only the missing MN113..MN120 shard
        run: |
          python scripts/build_mn_audio.py --start 113 --end 120 --out dist/mn-audio

      - name: Validate repaired MP3 files
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(find dist/mn-audio -maxdepth 1 -name 'mn*.mp3' | wc -l)
          test "$ACTUAL" -eq 8
          for i in $(seq 113 120); do
            file="dist/mn-audio/mn${i}.mp3"
            test -f "$file"
            test "$(wc -c < "$file")" -gt 100000
            DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$file")
            python - "$file" "$DURATION" <<'PY'
          import sys
          path,duration=sys.argv[1],float(sys.argv[2])
          assert duration > 20, (path,duration)
          print(f'validated {path}: {duration/60:.1f} min')
          PY
          done

      - name: Find existing draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -r --arg tag "$AUDIO_TAG" '.[] | select(.tag_name==$tag) | .id' \
            | head -n1)
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Found release id=$RELEASE_ID"

      - name: Upload only MN113..MN120 to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 113 120); do
            gh release upload "$AUDIO_TAG" "dist/mn-audio/mn${i}.mp3" --clobber
          done

      - name: Verify exact MN1..MN152 set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100&page=1" > /tmp/assets1.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100&page=2" > /tmp/assets2.json
          jq -s 'add' /tmp/assets1.json /tmp/assets2.json > /tmp/assets.json
          python - <<'PY'
          import json
          assets=json.load(open('/tmp/assets.json',encoding='utf-8'))
          names={a['name'] for a in assets if a['name'].endswith('.mp3')}
          expected={f'mn{i}.mp3' for i in range(1,153)}
          missing=sorted(expected-names)
          extra=sorted(names-expected)
          print('MP3 assets:',len(names))
          if missing: print('Missing:',missing)
          if extra: print('Extra:',extra)
          assert names==expected, f'expected exact MN1..MN152; got {len(names)} MP3 assets'
          PY

      - name: Build public audio manifest
        run: |
          python - <<'PY'
          import json, os
          repo=os.environ['GITHUB_REPOSITORY']
          tag=os.environ['AUDIO_TAG']
          items=[]
          for i in range(1,153):
              items.append({
                  'id':f'nikaya.mn.{i}',
                  'canonicalRef':f'mn{i}',
                  'viCode':f'TB {i}',
                  'language':'vi',
                  'url':f'https://github.com/{repo}/releases/download/{tag}/mn{i}.mp3',
                  'provider':'5 Đại Tạng Kinh Nikāya',
                  'voice':'Piper vi_VN-vais1000-medium',
                  'prebuilt':True,
              })
          with open('mn-audio-manifest.json','w',encoding='utf-8') as f:
              json.dump({'version':'1','collection':'MN','language':'vi','count':152,'items':items},f,ensure_ascii=False,indent=2)
          PY

      - name: Upload manifest and publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          gh release upload "$AUDIO_TAG" mn-audio-manifest.json --clobber
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f draft=false >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$AUDIO_TAG" --jq '{id,tag_name,draft,assets:(.assets|length)}'
          echo 'FULL MN AUDIO RELEASE COMPLETE: 152/152' >> "$GITHUB_STEP_SUMMARY"
