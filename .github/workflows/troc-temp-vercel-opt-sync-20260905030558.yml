name: Troc Temporary Optional Secret Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VERCEL_TOKEN: ${{ secrets.TROC_TMP_VERCEL_TOKEN }}
      SRC_1: ${{ secrets.R2_ACCOUNT_ID }}
      SRC_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SRC_3: ${{ secrets.R2_ACCESS_KEY_ID }}
      SRC_4: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Securely sync optional secrets to Vercel
        shell: bash
        run: |
          set -euo pipefail

          test -n "${VERCEL_TOKEN:-}"

          upsert() {
            key="$1"
            value="$2"

            if [ -z "${value:-}" ]; then
              echo "SKIP $key - empty"
              return 0
            fi

            payload="$(
              jq -cn \
                --arg key "$key" \
                --arg value "$value" \
                '[{
                  key: $key,
                  value: $value,
                  type: "sensitive",
                  target: ["production"],
                  comment: "Securely migrated from GitHub Actions"
                }]'
            )"

            http="$(
              curl -sS \
                -o /tmp/vercel-response.json \
                -w "%{http_code}" \
                --request POST \
                --url "https://api.vercel.com/v10/projects/troc-youtube-command-center/env?upsert=true&slug=khoa-3f1b" \
                --header "Authorization: Bearer ${VERCEL_TOKEN}" \
                --header "Content-Type: application/json" \
                --data "$payload"
            )"

            if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
              echo "::error::Vercel HTTP $http for $key"
              exit 1
            fi

            if ! jq -e \
              '((.failed // []) | length) == 0' \
              /tmp/vercel-response.json \
              >/dev/null; then

              echo "::error::Vercel returned failed for $key"
              exit 1
            fi

            echo "UPSERTED $key"
          }

          upsert "R2_ACCOUNT_ID" "${SRC_1:-}"
          upsert "CLOUDFLARE_ACCOUNT_ID" "${SRC_2:-}"
          upsert "R2_ACCESS_KEY_ID" "${SRC_3:-}"
          upsert "R2_SECRET_ACCESS_KEY" "${SRC_4:-}"

          echo "OPTIONAL_SYNC_DONE=1"