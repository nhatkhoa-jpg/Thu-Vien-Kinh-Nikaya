name: Cloudflare Auth and Real Preview

on:
  push:
    branches: [deploy/cloudflare-preview]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-cutover
  cancel-in-progress: false

jobs:
  auth-only:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip cloudflare]')
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: AUTH ONLY — Cloudflare API
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "AUTH: FAIL — CLOUDFLARE_API_TOKEN is unavailable to this workflow"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "AUTH: FAIL — CLOUDFLARE_ACCOUNT_ID is unavailable to this workflow"; exit 1; }
          if npx wrangler whoami > /tmp/cloudflare-auth.log 2>&1; then
            grep -Eq 'API Token|OAuth Token' /tmp/cloudflare-auth.log || {
              echo "AUTH: FAIL — wrangler did not confirm token authentication"
              sed -E 's/[0-9a-fA-F]{32}/[REDACTED_ACCOUNT_ID]/g' /tmp/cloudflare-auth.log
              exit 1
            }
            echo "AUTH: PASS — Cloudflare API token authentication OK"
          else
            echo "AUTH: FAIL"
            sed -E 's/[0-9a-fA-F]{32}/[REDACTED_ACCOUNT_ID]/g' /tmp/cloudflare-auth.log
            exit 1
          fi

  deploy-preview-and-smoke:
    needs: auth-only
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ensure account workers.dev subdomain exists
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          AUTH_HEADER="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          CURRENT=$(curl -sS -H "$AUTH_HEADER" "$API")
          EXISTING=$(printf '%s' "$CURRENT" | jq -r 'if .success == true then (.result.subdomain // "") else "" end')
          if [ -n "$EXISTING" ]; then
            echo "workers.dev account subdomain already registered."
            exit 0
          fi

          candidates=("nhatkhoa-nikaya" "thu-vien-kinh-nikaya-nhatkhoa" "nikaya-nhatkhoa")
          for candidate in "${candidates[@]}"; do
            RESPONSE=$(curl -sS -X PUT -H "$AUTH_HEADER" -H 'Content-Type: application/json' \
              --data "{\"subdomain\":\"${candidate}\"}" "$API")
            if [ "$(printf '%s' "$RESPONSE" | jq -r '.success // false')" = "true" ]; then
              echo "workers.dev account subdomain registered successfully."
              exit 0
            fi
          done

          echo "Unable to register a workers.dev account subdomain with the prepared names."
          exit 1
      - run: npm run build:vinext
      - name: Verify Worker free-tier bundle
        run: |
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee /tmp/wrangler-dry-run.log
          grep -F -- "--dry-run: exiting now" /tmp/wrangler-dry-run.log
      - name: Deploy isolated preview Worker
        id: preview
        run: |
          set -euo pipefail
          npm run deploy:preview 2>&1 | tee /tmp/cloudflare-preview-deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/cloudflare-preview-deploy.log | tail -1)
          test -n "$URL" || { echo "Cloudflare deploy completed without a workers.dev URL"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Install browser for real preview smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke-test deployed preview
        run: node scripts/cloudflare_smoke.mjs "${{ steps.preview.outputs.url }}"
      - name: Record verified preview state
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          node scripts/record_cloudflare_preview.mjs
          git config user.name "nikaya-hosting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status/hosting-status.json docs/CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo "No hosting status changes to commit."
          else
            git commit -m "chore: record verified Cloudflare preview [skip cloudflare]"
            git push origin HEAD:deploy/cloudflare-preview
          fi
