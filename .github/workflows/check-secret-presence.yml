name: Audit AI and Cloudflare Secret Presence
on:
  push:
    branches: [ops/secret-audit]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          check(){ if [ -n "${2:-}" ]; then echo "$1=PRESENT"; else echo "$1=MISSING"; fi; }
          check GEMINI_API_KEY "$GEMINI_API_KEY"
          check GOOGLE_AI_API_KEY "$GOOGLE_AI_API_KEY"
          check GOOGLE_GEMINI_API_KEY "$GOOGLE_GEMINI_API_KEY"
          check GOOGLE_API_KEY "$GOOGLE_API_KEY"
          check CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          check CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          check R2_ACCOUNT_ID "$R2_ACCOUNT_ID"
          check R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          check R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          check R2_BUCKET_NAME "$R2_BUCKET_NAME"
          check VERCEL_TOKEN "$VERCEL_TOKEN"

      - name: Probe Cloudflare Workers AI REST
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          set +e
          model='@cf/black-forest-labs/flux-1-schnell'
          code=$(curl -sS -o /tmp/cf.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/${model}" \
            -d '{"prompt":"minimal warm sunrise over mountains, no text","steps":4,"seed":42}')
          if [ "$code" = "200" ]; then
            echo 'CLOUDFLARE_WORKERS_AI_REST=OK'
          else
            msg=$(jq -r '.errors[0].message // .error.message // "unknown error"' /tmp/cf.json 2>/dev/null | head -c 300)
            echo "CLOUDFLARE_WORKERS_AI_REST=FAILED HTTP_$code :: $msg"
          fi
          exit 0

      - name: Probe Workers AI binding through temporary Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/troc-ai-probe/src
          cat > /tmp/troc-ai-probe/package.json <<'JSON'
          {"private":true,"devDependencies":{"wrangler":"latest"}}
          JSON
          cat > /tmp/troc-ai-probe/wrangler.jsonc <<'JSON'
          {
            "name": "troc-ai-probe",
            "main": "src/index.js",
            "compatibility_date": "2026-09-01",
            "ai": { "binding": "AI" }
          }
          JSON
          cat > /tmp/troc-ai-probe/src/index.js <<'JS'
          export default {
            async fetch(request, env) {
              try {
                const result = await env.AI.run('@cf/meta/llama-3.1-8b-instruct', {prompt:'Return only OK', max_tokens:8});
                return Response.json({ok:true, hasResponse:Boolean(result?.response)});
              } catch (e) {
                return Response.json({ok:false,error:String(e?.message||e)}, {status:500});
              }
            }
          }
          JS
          cd /tmp/troc-ai-probe
          npm install --silent
          set +e
          npx wrangler deploy > /tmp/deploy.log 2>&1
          deploy_code=$?
          set -e
          if [ "$deploy_code" -ne 0 ]; then
            echo "CLOUDFLARE_AI_BINDING_DEPLOY=FAILED"
            tail -n 12 /tmp/deploy.log | sed -E 's/[A-Za-z0-9_\-]{24,}/[redacted]/g'
            exit 0
          fi
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -1)
          echo "CLOUDFLARE_AI_BINDING_DEPLOY=OK"
          if [ -z "$url" ]; then
            echo 'CLOUDFLARE_AI_BINDING_INFERENCE=UNKNOWN_NO_URL'
          else
            code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' "$url")
            ok=$(jq -r '.ok // false' /tmp/probe.json 2>/dev/null)
            echo "CLOUDFLARE_AI_BINDING_INFERENCE=HTTP_${code}_OK_${ok}"
          fi
          set +e
          npx wrangler delete troc-ai-probe --force >/tmp/delete.log 2>&1
          echo 'CLOUDFLARE_AI_PROBE_CLEANUP=DONE'
          exit 0
