name: Audit AI and Cloudflare Secret Presence
on:
  push:
    branches: [ops/secret-audit]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          check(){ if [ -n "${2:-}" ]; then echo "$1=PRESENT"; else echo "$1=MISSING"; fi; }
          check GEMINI_API_KEY "$GEMINI_API_KEY"
          check GOOGLE_AI_API_KEY "$GOOGLE_AI_API_KEY"
          check GOOGLE_GEMINI_API_KEY "$GOOGLE_GEMINI_API_KEY"
          check GOOGLE_API_KEY "$GOOGLE_API_KEY"
          check CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          check CLOUDFLARE_API_KEY "$CLOUDFLARE_API_KEY"
          check CF_API_TOKEN "$CF_API_TOKEN"
          check CF_API_KEY "$CF_API_KEY"
          check CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          check CF_ACCOUNT_ID "$CF_ACCOUNT_ID"
          check R2_ACCOUNT_ID "$R2_ACCOUNT_ID"
          check R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          check R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          check R2_BUCKET_NAME "$R2_BUCKET_NAME"
          check VERCEL_TOKEN "$VERCEL_TOKEN"
          check VERCEL_ACCESS_TOKEN "$VERCEL_ACCESS_TOKEN"
