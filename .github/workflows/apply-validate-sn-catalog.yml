name: Apply and validate SN catalog

on:
  push:
    branches:
      - feature/sn-canonical-discovery
    paths:
      - '.github/workflows/apply-validate-sn-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sn-canonical-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic SN catalog
        run: python3 scripts/materialize_sn_catalog.py --apply
      - name: Validate catalog invariants
        run: |
          node <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('data/catalog/suttas.json','utf8'));
          const sn=rows.filter(x=>x.collection==='SN');
          if(sn.length!==1819)throw new Error(`SN count ${sn.length}`);
          if(rows.length!==1977)throw new Error(`catalog count ${rows.length}`);
          for(const key of ['id','canonicalRef','slug']){
            const values=rows.map(x=>x[key]);
            if(new Set(values).size!==values.length)throw new Error(`duplicate ${key}`);
          }
          if(sn.filter(x=>x.source?.language==='vi'&&x.source?.translator==='Thích Minh Châu').length!==1805)throw new Error('Minh Chau coverage mismatch');
          if(sn.filter(x=>x.source?.language==='pli').length!==14)throw new Error('missing-VI marker mismatch');
          if(sn.filter(x=>x.canonicalRef.includes('-')).length!==134)throw new Error('range canonical mismatch');
          const seed1=sn.find(x=>x.canonicalRef==='sn56.11');
          const seed2=sn.find(x=>x.canonicalRef==='sn22.59');
          if(seed1.slug!=='sn-56-11-dhammacakkappavattana'||!seed1.topics.length)throw new Error('SN56.11 editorial seed lost');
          if(seed2.slug!=='sn-22-59-anattalakkhana'||!seed2.topics.length)throw new Error('SN22.59 editorial seed lost');
          console.log('CATALOG VALID', {total:rows.length,sn:sn.length});
          NODE
      - name: Install and generate exports
        run: |
          npm install
          npm run rag:export
      - name: Build application
        run: npm run build
      - name: Smoke test representative SN pages
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/nikaya-sn.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:3000/vi >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:3000/vi/library/sn-1-1 -o /tmp/sn11.html
          grep -Fq 'TƯB 1.1' /tmp/sn11.html
          grep -Fq 'Bộc Lưu' /tmp/sn11.html
          if grep -Fq '>0 phút<' /tmp/sn11.html; then echo 'FAIL: zero-minute metadata leaked'; exit 1; fi
          curl --fail --silent http://127.0.0.1:3000/vi/library/sn-3-15 -o /tmp/sn315.html
          grep -Fq 'chưa có bản Việt Thích Minh Châu' /tmp/sn315.html
          grep -Fq 'Thư viện không tự chuyển sang bản dịch khác' /tmp/sn315.html
          curl --fail --silent http://127.0.0.1:3000/vi/library/sn-22-59-anattalakkhana -o /tmp/sn2259.html
          grep -Fq 'Kinh Vô Ngã Tướng' /tmp/sn2259.html
          curl --fail --silent 'http://127.0.0.1:3000/vi?collection=SN' -o /tmp/home-sn.html
          grep -Fq 'Tương Ưng Bộ' /tmp/home-sn.html
          echo 'SN MATERIALIZATION SMOKE TEST PASS'
      - name: Commit applied catalog and regenerated exports
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/catalog/suttas.json data/exports data/catalog/sn-materialization-preview.json data/catalog/sn-materialization-report.json)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog/suttas.json data/exports data/catalog/sn-materialization-preview.json data/catalog/sn-materialization-report.json
          git commit -m 'data: materialize full SN canonical catalog'
          git push origin HEAD:feature/sn-canonical-discovery

# trigger apply/validate after UI and schema hardening
