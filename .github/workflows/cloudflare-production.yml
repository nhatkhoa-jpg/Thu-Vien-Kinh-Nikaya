name: Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Approved production release reason
        required: true
        default: Verified preview promotion
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-and-smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy cloudflare production]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify Cloudflare auth
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler whoami
      - run: npm run build:vinext
      - name: Verify Worker free-tier bundle
        run: |
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee /tmp/wrangler-dry-run.log
          grep -F -- "--dry-run: exiting now" /tmp/wrangler-dry-run.log
      - name: Deploy production Worker
        id: production
        run: |
          set -uo pipefail
          DEPLOY_OK=0
          for attempt in 1 2 3; do
            echo "Cloudflare production deploy attempt ${attempt}/3"
            : > /tmp/cloudflare-production-deploy.log
            set +e
            npm run deploy:vinext 2>&1 | tee /tmp/cloudflare-production-deploy.log
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -eq 0 ]; then
              DEPLOY_OK=1
              break
            fi
            if ! grep -Eqi '502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|upstream connect error|connection termination|connection reset|malformed response from the API|ECONNRESET|ETIMEDOUT' /tmp/cloudflare-production-deploy.log; then
              echo "Permanent/non-transient deploy failure; not retrying."
              exit "$code"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Cloudflare transient failure persisted after 3 attempts."
              exit "$code"
            fi
            delay=$((attempt * 15))
            echo "Transient Cloudflare API/network failure detected; retrying in ${delay}s."
            sleep "$delay"
          done
          test "$DEPLOY_OK" -eq 1
          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/cloudflare-production-deploy.log | tail -1)
          if [ -z "$URL" ]; then
            URL='https://thu-vien-kinh-nikaya.nhatkhoa-nikaya.workers.dev'
            echo "Wrangler returned no workers.dev URL; using the verified production hostname: $URL"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Install browser for production smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke-test production
        run: node scripts/cloudflare_smoke.mjs "${{ steps.production.outputs.url }}"
      - name: Production release summary
        run: |
          echo "### Cloudflare production PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.production.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
