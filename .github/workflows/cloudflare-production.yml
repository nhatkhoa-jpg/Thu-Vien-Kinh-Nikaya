name: Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Approved production release reason
        required: true
        default: Verified preview promotion

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify Cloudflare auth
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler whoami
      - run: npm run build:vinext
      - name: Verify Worker free-tier bundle
        run: |
          npx wrangler deploy --dry-run --config dist/server/wrangler.json 2>&1 | tee /tmp/wrangler-dry-run.log
          grep -F -- "--dry-run: exiting now" /tmp/wrangler-dry-run.log
      - name: Deploy production Worker
        id: production
        run: |
          set -euo pipefail
          npm run deploy:vinext 2>&1 | tee /tmp/cloudflare-production-deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/cloudflare-production-deploy.log | tail -1)
          test -n "$URL" || { echo "Production deploy completed without a workers.dev URL"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Install browser for production smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke-test production
        run: node scripts/cloudflare_smoke.mjs "${{ steps.production.outputs.url }}"
      - name: Production release summary
        run: |
          echo "### Cloudflare production PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: ${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.production.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
