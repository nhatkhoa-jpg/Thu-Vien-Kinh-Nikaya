name: Materialize DN Corpus

on:
  push:
    branches: [feature/sn-data-first-current-main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dn-corpus-data-first-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize DN1-DN34 Vietnamese corpus
        run: python scripts/materialize_dn_corpus.py
      - name: Validate canonical, full text, audio checkpoint mapping and provenance
        run: |
          python - <<'PY'
          import json,re
          s=json.load(open('data/catalog/suttas.json',encoding='utf-8'))
          c=json.load(open('data/content/dn.vi.json',encoding='utf-8'))
          a=json.load(open('data/catalog/audio.json',encoding='utf-8'))
          dn=[x for x in s if x.get('collection')=='DN']
          assert len(dn)==34, len(dn)
          assert {x['canonicalRef'] for x in dn}=={f'dn{i}' for i in range(1,35)}
          assert set(c)=={f'dn{i}' for i in range(1,35)}
          for i in range(1,35):
            uid=f'dn{i}'; x=c[uid]
            assert x['authorUid']=='minh_chau'
            assert x['sourceUrl'].startswith(f'https://suttacentral.net/{uid}/vi/')
            assert x['segments'] and sum(len(z['text']) for z in x['segments'])>500
            assert re.fullmatch(r'[0-9a-f]{64}',x['contentHash'])
            m=a[f'nikaya.dn.{i}']['vi']
            assert f'/releases/download/dn-vi-audio-v1/dn{i}.mp3' in m['url']
          print('PASS DN corpus: canonical=34 catalog=34 fulltext=34 audio-checkpoint=34')
          PY
      - run: npm install
      - name: RAG export and production build
        run: |
          npm run rag:export
          npm run build
      - name: Smoke test local materialized DN reader without source API dependency
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 >/tmp/next.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/vi >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then cat /tmp/next.log; exit 1; fi
          for ref in dn1 dn16 dn34; do
            slug=$(REF="$ref" node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('data/catalog/suttas.json','utf8'));
          const row=rows.find(x=>x.canonicalRef===process.env.REF);
          if(!row) process.exit(2);
          process.stdout.write(row.slug);
          NODE
            )
            echo "Smoke $ref -> $slug"
            curl -fsS "http://127.0.0.1:3000/vi/library/$slug" -o "/tmp/$ref.html"
            grep -Fq 'TOÀN VĂN BÀI KINH' "/tmp/$ref.html"
            grep -Fq 'Bản dịch:' "/tmp/$ref.html"
            grep -Fq 'PDF' "/tmp/$ref.html"
          done
          echo 'PASS DN reader smoke: dn1/dn16/dn34 full text + PDF surface'
      - name: Commit materialized corpus and generated exports
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog/suttas.json data/catalog/audio.json data/content/dn.vi.json data/exports/
          if git diff --cached --quiet; then echo 'No corpus changes'; exit 0; fi
          git commit -m 'data: materialize DN1-DN34 Vietnamese corpus'
          git push origin HEAD:${GITHUB_REF_NAME}
