name: R2 Bootstrap and Credential Smoke

on:
  push:
    branches: [ops/chatgpt-r2-bootstrap]
    paths:
      - '.github/workflows/r2-bootstrap.yml'
      - 'scripts/r2_smoke.py'
      - 'scripts/r2_sync.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: nikaya-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify secret availability without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${R2_ACCESS_KEY_ID:-}" || { echo 'R2_ACCESS_KEY_ID missing'; exit 1; }
          test -n "${R2_SECRET_ACCESS_KEY:-}" || { echo 'R2_SECRET_ACCESS_KEY missing'; exit 1; }
          test -n "${R2_ACCOUNT_ID:-}" || { echo 'R2_ACCOUNT_ID missing'; exit 1; }
          echo 'R2 secret availability: PASS'
      - name: Install S3 client library
        run: python -m pip install --disable-pip-version-check --quiet boto3
      - name: Validate R2 scripts
        run: python -m py_compile scripts/r2_smoke.py scripts/r2_sync.py
      - name: Upload, read, verify and delete smoke object
        run: python scripts/r2_smoke.py
      - name: Verify checksum-aware sync planner without writing objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2-sync-smoke
          printf 'nikaya-r2-sync-dry-run\n' >/tmp/r2-sync-smoke/sample.txt
          python scripts/r2_sync.py /tmp/r2-sync-smoke --prefix ops/dryrun --dry-run --max-total-gib 9
