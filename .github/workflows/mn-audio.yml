name: Build Majjhima Nikaya MP3

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate-mn-audio.py'
      - '.github/workflows/mn-audio.yml'

permissions:
  contents: write

concurrency:
  group: mn-audio-v1
  cancel-in-progress: false

env:
  RELEASE_TAG: mn-audio-v1
  MODEL_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/vi/vi_VN/vais1000/medium/vi_VN-vais1000-medium.onnx?download=true
  CONFIG_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/vi/vi_VN/vais1000/medium/vi_VN-vais1000-medium.onnx.json?download=true

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        batch:
          - { start: 1, end: 10 }
          - { start: 11, end: 20 }
          - { start: 21, end: 30 }
          - { start: 31, end: 40 }
          - { start: 41, end: 50 }
          - { start: 51, end: 60 }
          - { start: 61, end: 70 }
          - { start: 71, end: 80 }
          - { start: 81, end: 90 }
          - { start: 91, end: 100 }
          - { start: 101, end: 110 }
          - { start: 111, end: 120 }
          - { start: 121, end: 130 }
          - { start: 131, end: 140 }
          - { start: 141, end: 150 }
          - { start: 151, end: 152 }
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install piper-tts
      - name: Download Vietnamese Piper model
        run: |
          curl -L --fail --retry 4 "$MODEL_URL" -o vi_VN-vais1000-medium.onnx
          curl -L --fail --retry 4 "$CONFIG_URL" -o vi_VN-vais1000-medium.onnx.json
          test $(stat -c%s vi_VN-vais1000-medium.onnx) -gt 50000000
      - name: Generate MP3 batch
        env:
          PIPER_MODEL: vi_VN-vais1000-medium.onnx
          PIPER_CONFIG: vi_VN-vais1000-medium.onnx.json
          MN_VI_AUTHOR: minh_chau
        run: |
          python scripts/generate-mn-audio.py ${{ matrix.batch.start }} ${{ matrix.batch.end }} out/mn
          count=$(find out/mn -name 'mn*.mp3' | wc -l)
          expected=$(( ${{ matrix.batch.end }} - ${{ matrix.batch.start }} + 1 ))
          test "$count" -eq "$expected"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "out/mn/mn$(printf '%03d' ${{ matrix.batch.start }}).mp3"
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Majjhima Nikaya Vietnamese MP3" --notes "Pre-generated Vietnamese listening files for all 152 Majjhima Nikaya discourses. Generated once in CI; website clients only stream MP3."
      - name: Upload MP3 and batch manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" out/mn/*.mp3 out/mn/manifest-*.json --clobber

  verify-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 152 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          missing=0
          for n in $(seq 1 152); do
            name=$(printf 'mn%03d.mp3' "$n")
            if ! grep -qx "$name" <<<"$assets"; then
              echo "Missing $name"
              missing=1
            fi
          done
          test "$missing" -eq 0
          echo "All 152 Majjhima Nikaya MP3 assets are present."
