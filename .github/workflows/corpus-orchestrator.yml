name: Corpus Orchestrator

on:
  workflow_dispatch:
    inputs:
      collection:
        description: Collection to resume, or AUTO for the next incomplete lane
        required: true
        default: AUTO
        type: choice
        options: [AUTO, MN, SN, AN, KN]
      batch_size:
        description: Maximum canonical records in this checkpoint
        required: true
        default: "500"
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "data/content/**"
      - "data/status/**"
      - ".github/workflows/corpus-orchestrator.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: corpus-writer-main
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      REQUESTED_COLLECTION: ${{ inputs.collection || 'AUTO' }}
      BATCH_SIZE: ${{ inputs.batch_size || '500' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve next incomplete collection
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path

          requested = os.environ.get("REQUESTED_COLLECTION", "AUTO")
          data = json.loads(Path("data/status/corpus-status.json").read_text(encoding="utf-8"))
          rows = {x["collection"]: x for x in data.get("collections", [])}
          order = ["MN", "AN", "SN", "KN"]
          if requested != "AUTO":
              chosen = requested
          else:
              chosen = next((c for c in order if int(rows.get(c, {}).get("pendingFullTextCount", 0)) > 0), "")
          pending = int(rows.get(chosen, {}).get("pendingFullTextCount", 0)) if chosen else 0
          print(f"collection={chosen}")
          print(f"pending={pending}")
          print(f"needs_work={'true' if chosen and pending > 0 else 'false'}")
          PY
      - name: Report no pending corpus work
        if: steps.resolve.outputs.needs_work != 'true'
        run: echo "All currently modeled Nikaya full-text lanes have zero pending records."
      - name: Materialize one resumable batch
        if: steps.resolve.outputs.needs_work == 'true'
        run: python scripts/materialize_fulltext.py --collection "${{ steps.resolve.outputs.collection }}" --batch-size "$BATCH_SIZE" --workers 12
      - name: Refresh and validate machine-readable status
        if: steps.resolve.outputs.needs_work == 'true'
        run: |
          python scripts/update_corpus_status.py
          python scripts/validate_corpus.py --collection "${{ steps.resolve.outputs.collection }}"
      - name: Commit verified checkpoint
        id: checkpoint
        if: steps.resolve.outputs.needs_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No new verified corpus records."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "nikaya-corpus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/content data/status
          git commit -m "corpus: checkpoint ${{ steps.resolve.outputs.collection }} full text [skip corpus]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish verified checkpoint to Cloudflare production
        if: steps.checkpoint.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cloudflare-production.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f reason="Verified corpus checkpoint ${{ steps.resolve.outputs.collection }}"
