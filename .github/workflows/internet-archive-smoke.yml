name: Internet Archive Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      IA_IDENTIFIER: nikaya-ops-health-smoke-nhatkhoa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check secret presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IA_ACCESS_KEY" || { echo 'IA_ACCESS_KEY is missing'; exit 1; }
          test -n "$IA_SECRET_KEY" || { echo 'IA_SECRET_KEY is missing'; exit 1; }
          echo 'PASS: both Internet Archive secrets are available to GitHub Actions.'
      - name: Install Internet Archive client
        run: python -m pip install --disable-pip-version-check internetarchive requests
      - name: Upload and verify disposable smoke object
        run: python scripts/ia_smoke.py
