name: Progressive Google Cloud TTS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: progressive-google-cloud-tts
  cancel-in-progress: false

env:
  RELEASE_TAG: mn-vi-cloud-audio-v1
  GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}

jobs:
  render-one:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate secret and install tools
        run: |
          set -euo pipefail
          test -n "$GOOGLE_TTS_API_KEY"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
      - name: Create or reuse cloud audio release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target main \
              --title 'Trung Bộ · Google Cloud TTS final-quality v1' \
              --notes 'Progressive quota-guarded Google Cloud TTS. Every discourse has MP3 + JSON receipt with provider, model, voice, character count, duration, source and hashes. Existing library MP3 remains available as fallback.'
          fi
      - name: Select next missing discourse and a safe free-tier model
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > /tmp/release.json
          jq -r '.assets[].name' /tmp/release.json 2>/dev/null | sort -u > /tmp/assets.txt || true
          python3 - <<'PY'
          import datetime,importlib.util,json,pathlib
          spec=importlib.util.spec_from_file_location('cloud','scripts/build_cloud_tts_one.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          p=pathlib.Path('data/audio/cloud-tts-usage.json'); usage=json.loads(p.read_text(encoding='utf-8'))
          month=datetime.date.today().strftime('%Y-%m')
          if usage.get('month')!=month:
              usage['month']=month
              for q in usage['models'].values():
                  q['usedCharacters']=0
                  q['remainingProjectSafeCharacters']=q['projectSafetyLimitCharacters']
                  q['status']='SAFE'
              usage.setdefault('events',[]).append({'date':datetime.date.today().isoformat(),'purpose':'monthly project quota ledger reset','canonicalRef':None,'result':'reset'})
              p.write_text(json.dumps(usage,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assets=set(pathlib.Path('/tmp/assets.txt').read_text().splitlines()) if pathlib.Path('/tmp/assets.txt').exists() else set()
          refs=[f'mn{i}' for i in range(1,153)]
          missing=[r for r in refs if f'{r}.mp3' not in assets or f'{r}.json' not in assets]
          if not missing:
              pathlib.Path('/tmp/pick.env').write_text('done=true\nreason=MN-cloud-audio-complete\n'); raise SystemExit
          ref=missing[0]
          text,_,_=m.fetch_text(ref); needed=sum(len(x) for x in m.chunks(text))
          models=usage['models']; completed=152-len(missing)
          weighted=['chirp3-hd','neural2','wavenet','wavenet','wavenet','wavenet']
          preferred=weighted[completed%len(weighted)]; order=[]
          for x in [preferred,*weighted]:
              if x not in order: order.append(x)
          chosen=next((model for model in order if models[model]['usedCharacters']+needed<=models[model]['projectSafetyLimitCharacters']),None)
          if chosen is None:
              pathlib.Path('/tmp/pick.env').write_text(f'done=true\nreason=monthly-safe-quota-exhausted\nneeded={needed}\n'); raise SystemExit
          pathlib.Path('/tmp/pick.env').write_text(f'done=false\nref={ref}\nmodel={chosen}\nneeded={needed}\n')
          PY
          cat /tmp/pick.env >> "$GITHUB_OUTPUT"
      - name: Stop cleanly when complete or monthly safe quota is exhausted
        if: steps.pick.outputs.done == 'true'
        run: |
          echo "No render this run: ${{ steps.pick.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Render one discourse
        if: steps.pick.outputs.done != 'true'
        run: |
          set -euo pipefail
          rm -rf dist/cloud-one
          python3 scripts/build_cloud_tts_one.py --ref '${{ steps.pick.outputs.ref }}' --model '${{ steps.pick.outputs.model }}' --out dist/cloud-one
      - name: Validate and upload checkpoint immediately
        if: steps.pick.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF='${{ steps.pick.outputs.ref }}'
          test -s "dist/cloud-one/$REF.mp3"
          test -s "dist/cloud-one/$REF.json"
          D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "dist/cloud-one/$REF.mp3")
          python3 - "$D" <<'PY'
          import sys
          assert float(sys.argv[1])>20
          PY
          gh release upload "$RELEASE_TAG" "dist/cloud-one/$REF.mp3" "dist/cloud-one/$REF.json" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Update usage ledger and public audio catalog
        if: steps.pick.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.pick.outputs.ref }}
          MODEL: ${{ steps.pick.outputs.model }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > /tmp/release-after.json
          jq -r '.assets[].name' /tmp/release-after.json 2>/dev/null | sort -u > /tmp/assets-after.txt
          python3 - <<'PY'
          import datetime,json,os,re
          usage_path='data/audio/cloud-tts-usage.json'; u=json.load(open(usage_path,encoding='utf-8'))
          ref=os.environ['REF']; meta=json.load(open(f'dist/cloud-one/{ref}.json',encoding='utf-8')); chars=int(meta['characters']); q=u['models'][os.environ['MODEL']]
          q['usedCharacters']+=chars;q['remainingProjectSafeCharacters']=max(0,q['projectSafetyLimitCharacters']-q['usedCharacters']);q['status']='SAFE' if q['remainingProjectSafeCharacters']>0 else 'STOPPED'
          u['events'].append({'date':datetime.date.today().isoformat(),'purpose':'progressive final-quality scripture audio','canonicalRef':ref,'charactersPerVoice':chars,'voices':[meta['voice']],'model':os.environ['MODEL'],'workflowRun':os.environ.get('GITHUB_RUN_ID'),'result':'success'})
          json.dump(u,open(usage_path,'w',encoding='utf-8'),ensure_ascii=False,indent=2);open(usage_path,'a').write('\n')

          assets=set(open('/tmp/assets-after.txt',encoding='utf-8').read().splitlines())
          catalog=json.load(open('data/catalog/suttas.json',encoding='utf-8')); audio=json.load(open('data/catalog/audio.json',encoding='utf-8'))
          rows={str(x.get('canonicalRef','')).lower():x for x in catalog}
          tag=os.environ.get('RELEASE_TAG','mn-vi-cloud-audio-v1')
          for name in sorted(assets):
              m=re.fullmatch(r'(mn\d+)\.mp3',name)
              if not m or f'{m.group(1)}.json' not in assets: continue
              r=m.group(1); row=rows.get(r)
              if not row: continue
              audio.setdefault(row['id'],{})['vi']={
                  'url':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{tag}/{r}.mp3',
                  'label':f'{row.get("viCode") or row.get("code") or r.upper()} · Google Cloud TTS',
                  'provider':'Google Cloud Text-to-Speech',
                  'sourceUrl':f'https://suttacentral.net/{r}/vi/minh_chau','download':True
              }
          json.dump(audio,open('data/catalog/audio.json','w',encoding='utf-8'),ensure_ascii=False,indent=2);open('data/catalog/audio.json','a').write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audio/cloud-tts-usage.json data/catalog/audio.json
          git commit -m "audio: publish Google Cloud TTS ${{ steps.pick.outputs.ref }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish verified audio catalog to production
        if: steps.pick.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cloudflare-production.yml --repo "$GITHUB_REPOSITORY" --ref main -f reason="Verified Google Cloud TTS ${{ steps.pick.outputs.ref }}"
      - name: Summary
        if: steps.pick.outputs.done != 'true'
        run: |
          echo "Rendered and published ${{ steps.pick.outputs.ref }} with ${{ steps.pick.outputs.model }}; planned chars ${{ steps.pick.outputs.needed }}." >> "$GITHUB_STEP_SUMMARY"
