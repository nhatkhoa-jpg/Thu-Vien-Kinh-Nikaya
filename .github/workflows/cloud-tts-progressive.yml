name: Progressive Google Cloud TTS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: progressive-google-cloud-tts
  cancel-in-progress: false

env:
  RELEASE_TAG: mn-vi-cloud-audio-v1
  GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
  BATCH_SIZE: "5"

jobs:
  render-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate secret and install tools
        run: |
          set -euo pipefail
          test -n "$GOOGLE_TTS_API_KEY"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq

      - name: Create or reuse cloud audio release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target main \
              --title 'Kinh Nikāya · Google Cloud TTS final-quality v1' \
              --notes 'Progressive quota-guarded Google Cloud TTS. Up to five source-backed Vietnamese discourses per checkpoint. Every discourse has MP3 + JSON receipt with provider, model, voice, character count, duration, source and hashes. Existing library MP3 remains available as fallback.'
          fi

      - name: Select up to five missing source-backed Vietnamese discourses
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > /tmp/release.json
          jq -r '.assets[].name' /tmp/release.json 2>/dev/null | sort -u > /tmp/assets.txt || true
          python3 - <<'PY'
          import datetime,importlib.util,json,os,pathlib

          spec=importlib.util.spec_from_file_location('cloud','scripts/build_cloud_tts_one.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          usage_path=pathlib.Path('data/audio/cloud-tts-usage.json')
          usage=json.loads(usage_path.read_text(encoding='utf-8'))
          month=datetime.date.today().strftime('%Y-%m')
          if usage.get('month')!=month:
              usage['month']=month
              for q in usage['models'].values():
                  q['usedCharacters']=0
                  q['remainingProjectSafeCharacters']=q['projectSafetyLimitCharacters']
                  q['status']='SAFE'
              usage.setdefault('events',[]).append({'date':datetime.date.today().isoformat(),'purpose':'monthly project quota ledger reset','canonicalRef':None,'result':'reset'})
              usage_path.write_text(json.dumps(usage,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          assets=set(pathlib.Path('/tmp/assets.txt').read_text(encoding='utf-8').splitlines()) if pathlib.Path('/tmp/assets.txt').exists() else set()
          catalog=json.load(open('data/catalog/suttas.json',encoding='utf-8'))

          # Priority 1: finish the full Majjhima Nikāya in canonical order.
          refs=[f'mn{i}' for i in range(1,153)]
          # Priority 2: automatically continue through every other catalogued canonical ref.
          # fetch_text() below is the source-backed gate: refs without a Vietnamese translation are skipped.
          seen=set(refs)
          for row in catalog:
              ref=str(row.get('canonicalRef','')).strip().lower()
              if ref and ref not in seen:
                  refs.append(ref); seen.add(ref)

          models=usage['models']
          reserved={k:int(v.get('usedCharacters',0)) for k,v in models.items()}
          weighted=['chirp3-hd','neural2','wavenet','wavenet','wavenet','wavenet']
          batch=[]
          batch_size=max(1,int(os.environ.get('BATCH_SIZE','5')))
          completed=sum(1 for r in refs if f'{r}.mp3' in assets and f'{r}.json' in assets)

          for ref in refs:
              if len(batch)>=batch_size:
                  break
              if f'{ref}.mp3' in assets and f'{ref}.json' in assets:
                  continue
              try:
                  text,_,_=m.fetch_text(ref)
                  needed=sum(len(x) for x in m.chunks(text))
              except Exception:
                  # No trustworthy Vietnamese source/translation available: do not synthesize it.
                  continue
              preferred=weighted[(completed+len(batch))%len(weighted)]
              order=[]
              for name in [preferred,*weighted]:
                  if name not in order:
                      order.append(name)
              chosen=next((name for name in order if reserved[name]+needed<=models[name]['projectSafetyLimitCharacters']),None)
              if chosen is None:
                  continue
              reserved[chosen]+=needed
              batch.append({'ref':ref,'model':chosen,'needed':needed})

          pathlib.Path('/tmp/batch.json').write_text(json.dumps(batch,ensure_ascii=False),encoding='utf-8')
          if batch:
              print(json.dumps(batch,ensure_ascii=False,indent=2))
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
                  f.write('done=false\n')
                  f.write(f'count={len(batch)}\n')
          else:
              safe_remaining=sum(max(0,int(v['projectSafetyLimitCharacters'])-int(v.get('usedCharacters',0))) for v in models.values())
              reason='no-source-backed-missing-discourse-or-monthly-safe-quota-exhausted'
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
                  f.write('done=true\n')
                  f.write(f'reason={reason}\n')
                  f.write(f'safe_remaining={safe_remaining}\n')
          PY

      - name: Stop cleanly when nothing safe is renderable
        if: steps.pick.outputs.done == 'true'
        run: |
          echo "No render this run: ${{ steps.pick.outputs.reason }}; safe remaining chars=${{ steps.pick.outputs.safe_remaining }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Render, validate and upload each checkpoint
        if: steps.pick.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/cloud-batch
          mkdir -p dist/cloud-batch
          jq -c '.[]' /tmp/batch.json > /tmp/batch.ndjson
          while IFS= read -r item <&3; do
            REF=$(jq -r '.ref' <<<"$item")
            MODEL=$(jq -r '.model' <<<"$item")
            OUT="dist/cloud-batch/$REF"
            mkdir -p "$OUT"
            echo "Rendering $REF with $MODEL"
            python3 scripts/build_cloud_tts_one.py --ref "$REF" --model "$MODEL" --out "$OUT" </dev/null
            test -s "$OUT/$REF.mp3"
            test -s "$OUT/$REF.json"
            D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT/$REF.mp3")
            python3 - "$D" <<'PY'
          import sys
          assert float(sys.argv[1])>20
          PY
            gh release upload "$RELEASE_TAG" "$OUT/$REF.mp3" "$OUT/$REF.json" --repo "$GITHUB_REPOSITORY" --clobber </dev/null
          done 3< /tmp/batch.ndjson

      - name: Update quota ledger and public audio catalog once for the batch
        if: steps.pick.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,pathlib

          usage_path='data/audio/cloud-tts-usage.json'
          u=json.load(open(usage_path,encoding='utf-8'))
          catalog=json.load(open('data/catalog/suttas.json',encoding='utf-8'))
          audio=json.load(open('data/catalog/audio.json',encoding='utf-8'))
          rows={str(x.get('canonicalRef','')).lower():x for x in catalog}
          tag=os.environ.get('RELEASE_TAG','mn-vi-cloud-audio-v1')
          batch=json.load(open('/tmp/batch.json',encoding='utf-8'))

          for item in batch:
              ref=item['ref']; model=item['model']
              meta=json.load(open(f'dist/cloud-batch/{ref}/{ref}.json',encoding='utf-8'))
              chars=int(meta['characters']); q=u['models'][model]
              q['usedCharacters']+=chars
              q['remainingProjectSafeCharacters']=max(0,q['projectSafetyLimitCharacters']-q['usedCharacters'])
              q['status']='SAFE' if q['remainingProjectSafeCharacters']>0 else 'STOPPED'
              u['events'].append({
                  'date':datetime.date.today().isoformat(),
                  'purpose':'progressive final-quality scripture audio',
                  'canonicalRef':ref,
                  'charactersPerVoice':chars,
                  'voices':[meta['voice']],
                  'model':model,
                  'workflowRun':os.environ.get('GITHUB_RUN_ID'),
                  'result':'success'
              })
              row=rows.get(ref)
              if row:
                  audio.setdefault(row['id'],{})['vi']={
                      'url':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{tag}/{ref}.mp3',
                      'label':f'{row.get("viCode") or row.get("code") or ref.upper()} · Google Cloud TTS',
                      'provider':'Google Cloud Text-to-Speech',
                      'sourceUrl':meta['textSource'],
                      'download':True
                  }

          json.dump(u,open(usage_path,'w',encoding='utf-8'),ensure_ascii=False,indent=2);open(usage_path,'a').write('\n')
          json.dump(audio,open('data/catalog/audio.json','w',encoding='utf-8'),ensure_ascii=False,indent=2);open('data/catalog/audio.json','a').write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audio/cloud-tts-usage.json data/catalog/audio.json
          REFS=$(jq -r 'map(.ref)|join(",")' /tmp/batch.json)
          git commit -m "audio: publish Google Cloud TTS batch $REFS" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish verified batch catalog to production
        if: steps.pick.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REFS=$(jq -r 'map(.ref)|join(",")' /tmp/batch.json)
          gh workflow run cloudflare-production.yml --repo "$GITHUB_REPOSITORY" --ref main -f reason="Verified Google Cloud TTS batch $REFS"

      - name: Summary
        if: steps.pick.outputs.done != 'true'
        run: |
          echo "Rendered and published ${{ steps.pick.outputs.count }} source-backed Vietnamese discourses this run." >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- \(.ref): \(.model), planned chars=\(.needed)"' /tmp/batch.json >> "$GITHUB_STEP_SUMMARY"
