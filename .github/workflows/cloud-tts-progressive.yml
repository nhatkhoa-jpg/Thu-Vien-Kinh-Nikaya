name: Progressive Google Cloud TTS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloud-tts-progressive.yml'
      - 'scripts/build_cloud_tts_one.py'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progressive-google-cloud-tts
  cancel-in-progress: false

env:
  RELEASE_TAG: mn-vi-cloud-audio-v1
  GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}

jobs:
  render-one:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate secret and install tools
        run: |
          set -euo pipefail
          test -n "$GOOGLE_TTS_API_KEY"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
      - name: Create or reuse cloud audio release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Trung Bộ · Google Cloud TTS final-quality v1' \
              --notes 'Progressive monthly free-tier rendering. Each discourse has MP3 + JSON receipt with provider, model, voice, character count, duration and hashes. Piper release remains untouched as fallback.'
          fi
      - name: Select next missing discourse and a safe free-tier model
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > /tmp/release.json
          jq -r '.assets[].name' /tmp/release.json 2>/dev/null | sort -u > /tmp/assets.txt || true
          python3 - <<'PY'
          import importlib.util,json,os,pathlib
          spec=importlib.util.spec_from_file_location('cloud','scripts/build_cloud_tts_one.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          usage=json.load(open('data/audio/cloud-tts-usage.json',encoding='utf-8'))
          assets=set(pathlib.Path('/tmp/assets.txt').read_text().splitlines()) if pathlib.Path('/tmp/assets.txt').exists() else set()
          refs=[f'mn{i}' for i in range(1,153)]
          missing=[r for r in refs if f'{r}.mp3' not in assets or f'{r}.json' not in assets]
          if not missing:
              open('/tmp/pick.env','w').write('done=true\n'); raise SystemExit
          ref=missing[0]
          text,_,_=m.fetch_text(ref); needed=sum(len(x) for x in m.chunks(text))
          models=usage['models']; completed=(152-len(missing))
          weighted=['chirp3-hd','neural2','wavenet','wavenet','wavenet','wavenet']
          preferred=weighted[completed%len(weighted)]
          order=[preferred]+[x for x in weighted if x!=preferred]
          seen=[]; order=[x for x in order if not (x in seen or seen.append(x))]
          chosen=None
          for model in order:
              q=models[model]
              if q['usedCharacters']+needed <= q['projectSafetyLimitCharacters']:
                  chosen=model; break
          if chosen is None:
              open('/tmp/pick.env','w').write(f'done=true\nreason=monthly-safe-quota-exhausted\nneeded={needed}\n'); raise SystemExit
          open('/tmp/pick.env','w').write(f'done=false\nref={ref}\nmodel={chosen}\nneeded={needed}\n')
          PY
          cat /tmp/pick.env >> "$GITHUB_OUTPUT"
      - name: Stop cleanly when complete or monthly safe quota is exhausted
        if: steps.pick.outputs.done == 'true'
        run: |
          echo "No render this run: ${{ steps.pick.outputs.reason || 'MN cloud audio already complete' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Render one discourse
        if: steps.pick.outputs.done != 'true'
        run: |
          set -euo pipefail
          rm -rf dist/cloud-one
          python3 scripts/build_cloud_tts_one.py --ref '${{ steps.pick.outputs.ref }}' --model '${{ steps.pick.outputs.model }}' --out dist/cloud-one
      - name: Validate and upload checkpoint immediately
        if: steps.pick.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF='${{ steps.pick.outputs.ref }}'
          test -s "dist/cloud-one/$REF.mp3"
          test -s "dist/cloud-one/$REF.json"
          D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "dist/cloud-one/$REF.mp3")
          python3 - "$D" <<'PY'
          import sys
          assert float(sys.argv[1])>20
          PY
          gh release upload "$RELEASE_TAG" "dist/cloud-one/$REF.mp3" "dist/cloud-one/$REF.json" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Update project-side usage ledger
        if: steps.pick.outputs.done != 'true'
        env:
          REF: ${{ steps.pick.outputs.ref }}
          MODEL: ${{ steps.pick.outputs.model }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os
          p='data/audio/cloud-tts-usage.json'; u=json.load(open(p,encoding='utf-8'))
          meta=json.load(open(f'dist/cloud-one/{os.environ["REF"]}.json',encoding='utf-8'))
          chars=int(meta['characters']); q=u['models'][os.environ['MODEL']]
          q['usedCharacters']+=chars
          q['remainingProjectSafeCharacters']=max(0,q['projectSafetyLimitCharacters']-q['usedCharacters'])
          q['status']='SAFE' if q['remainingProjectSafeCharacters']>0 else 'STOPPED'
          u['events'].append({'date':datetime.date.today().isoformat(),'purpose':'progressive final-quality scripture audio','canonicalRef':os.environ['REF'],'charactersPerVoice':chars,'voices':[meta['voice']],'model':os.environ['MODEL'],'workflowRun':os.environ.get('GITHUB_RUN_ID'),'result':'success'})
          json.dump(u,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audio/cloud-tts-usage.json
          git commit -m "audio: record cloud TTS usage for ${{ steps.pick.outputs.ref }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Summary
        if: steps.pick.outputs.done != 'true'
        run: |
          echo "Rendered ${{ steps.pick.outputs.ref }} with ${{ steps.pick.outputs.model }}; planned chars ${{ steps.pick.outputs.needed }}." >> "$GITHUB_STEP_SUMMARY"
