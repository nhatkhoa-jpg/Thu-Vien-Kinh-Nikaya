name: Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate and validate AI/RAG exports
        run: |
          npm run rag:export
          test "$(wc -l < data/exports/nikaya-rag.vi.jsonl)" -eq 22
          test "$(wc -l < data/exports/nikaya-rag.en.jsonl)" -eq 22
          test "$(wc -l < data/exports/nikaya-knowledge.vi.jsonl)" -eq 11
          test "$(wc -l < data/exports/nikaya-knowledge.en.jsonl)" -eq 11
          node -e "const fs=require('fs'); for(const f of fs.readdirSync('data/exports')) for(const l of fs.readFileSync('data/exports/'+f,'utf8').trim().split('\\n')) JSON.parse(l)"
      - run: npm run build
      - name: Smoke test compact reader and internal TTS
        run: |
          npm run start -- -p 3000 > /tmp/nikaya-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          READY=0
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/vi > /dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/nikaya-next.log; exit 1; fi
          curl --fail --silent http://127.0.0.1:3000/vi/library/mn-21-kakacupama -o /tmp/mn21.html
          grep -q 'compactEssentials' /tmp/mn21.html
          grep -q 'essentialDisclosure' /tmp/mn21.html
          grep -q 'V4.8' /tmp/mn21.html
          curl --fail --silent http://127.0.0.1:3000/en > /dev/null
          curl --fail --silent --show-error -X POST http://127.0.0.1:3000/api/tts \
            -H 'Content-Type: application/json' \
            --data '{"text":"Đây là bài kiểm tra giọng đọc tiếng Việt của thư viện.","locale":"vi","rate":1}' \
            -o /tmp/nikaya-tts.wav
          test "$(head -c 4 /tmp/nikaya-tts.wav)" = "RIFF"
          test "$(wc -c < /tmp/nikaya-tts.wav)" -gt 1000
