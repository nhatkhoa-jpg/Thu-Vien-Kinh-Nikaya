name: DN + SN data-first current main

on:
  push:
    branches:
      - feature/sn-data-first-current-main
    paths:
      - '.github/workflows/sn-data-first-current-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sn-data-first-current-main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize DN1-DN34 Vietnamese corpus and catalog
        run: python3 scripts/materialize_dn_corpus.py

      - name: Discover authoritative SN refs and metadata
        run: python3 scripts/discover_sn_catalog.py

      - name: Materialize SN into current mainline catalog
        run: python3 scripts/materialize_sn_catalog.py --apply

      - name: Validate DN + SN corpus invariants before build
        run: |
          node <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('data/catalog/suttas.json','utf8'));
          const audio=JSON.parse(fs.readFileSync('data/catalog/audio.json','utf8'));
          const dnCorpus=JSON.parse(fs.readFileSync('data/content/dn.vi.json','utf8'));
          const count=c=>rows.filter(x=>x.collection===c).length;
          const sn=rows.filter(x=>x.collection==='SN');
          if(count('MN')!==152)throw new Error(`MN regressed: ${count('MN')}/152`);
          if(count('DN')!==34)throw new Error(`DN catalog ${count('DN')}/34`);
          if(Object.keys(dnCorpus).length!==34)throw new Error(`DN full-text corpus ${Object.keys(dnCorpus).length}/34`);
          for(let i=1;i<=34;i++){
            const uid=`dn${i}`;
            if(!dnCorpus[uid]?.segments?.length)throw new Error(`missing DN full text ${uid}`);
            if(!audio[`nikaya.dn.${i}`]?.vi?.url?.includes(`/dn${i}.mp3`))throw new Error(`missing DN audio checkpoint ${i}`);
          }
          if(sn.length!==1819)throw new Error(`SN count ${sn.length}/1819`);
          if(count('AN')!==2)throw new Error(`AN seed count changed unexpectedly: ${count('AN')}`);
          if(count('KN')!==2)throw new Error(`KN seed count changed unexpectedly: ${count('KN')}`);
          if(rows.length!==2009)throw new Error(`catalog total ${rows.length}/2009`);
          for(const key of ['id','canonicalRef','slug']){
            const values=rows.map(x=>x[key]);
            if(new Set(values).size!==values.length)throw new Error(`duplicate ${key}`);
          }
          const minh=sn.filter(x=>x.source?.language==='vi'&&x.source?.translator==='Thích Minh Châu').length;
          const paliOnly=sn.filter(x=>x.source?.language==='pli').length;
          const ranges=sn.filter(x=>x.canonicalRef.includes('-')).length;
          if(minh!==1805)throw new Error(`SN Minh Chau coverage ${minh}/1805`);
          if(paliOnly!==14)throw new Error(`SN missing-VI count ${paliOnly}/14`);
          if(ranges!==134)throw new Error(`SN canonical range count ${ranges}/134`);
          const seed1=sn.find(x=>x.canonicalRef==='sn56.11');
          const seed2=sn.find(x=>x.canonicalRef==='sn22.59');
          if(!seed1||!seed2)throw new Error('existing SN editorial seeds missing');
          console.log({total:rows.length,DN:count('DN'),MN:count('MN'),SN:sn.length,AN:count('AN'),KN:count('KN'),dnCorpus:Object.keys(dnCorpus).length,minh,paliOnly,ranges});
          NODE

      - name: Install dependencies and regenerate source-backed exports
        run: |
          npm install
          npm run rag:export
          node <<'NODE'
          const fs=require('fs');
          const paths=['data/exports/nikaya-rag.vi.jsonl','data/exports/nikaya-rag.en.jsonl','data/exports/nikaya-knowledge.vi.jsonl','data/exports/nikaya-knowledge.en.jsonl'];
          for(const p of paths){
            const lines=fs.readFileSync(p,'utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
            if(!lines.length)throw new Error(`${p} empty`);
            for(const x of lines){if(!String(x.text||'').trim())throw new Error(`${p} contains empty text`);}
          }
          NODE

      - name: Build application
        run: npm run build

      - name: Smoke test DN, SN and preserve MN reader
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/nikaya-dn-sn-current-main.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          READY=0
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/vi >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/nikaya-dn-sn-current-main.log; exit 1; fi

          fetch_page(){
            local url="$1" out="$2" code
            code=$(curl --silent --show-error --output "$out" --write-out '%{http_code}' "$url" || true)
            echo "HTTP $code $url"
            if [ "$code" != "200" ]; then
              echo "FAIL page: $url"
              tail -120 /tmp/nikaya-dn-sn-current-main.log || true
              exit 1
            fi
          }

          for uid in dn1 dn16 dn34; do
            slug=$(node -e "const rows=require('./data/catalog/suttas.json');const s=rows.find(x=>x.canonicalRef===process.argv[1]);if(!s)process.exit(2);process.stdout.write(s.slug)" "$uid")
            echo "DN smoke $uid -> $slug"
            fetch_page "http://127.0.0.1:3000/vi/library/$slug" "/tmp/$uid.html"
            grep -Fq 'TOÀN VĂN BÀI KINH' "/tmp/$uid.html"
            grep -Fq 'PDF' "/tmp/$uid.html"
          done

          fetch_page 'http://127.0.0.1:3000/vi?collection=SN' /tmp/home-sn.html
          grep -Fq 'Tương Ưng Bộ' /tmp/home-sn.html

          fetch_page http://127.0.0.1:3000/vi/library/sn-1-1 /tmp/sn11.html
          grep -Fq 'TƯB 1.1' /tmp/sn11.html
          grep -Fq 'Bộc Lưu' /tmp/sn11.html
          if grep -Fq '>0 phút<' /tmp/sn11.html; then echo 'FAIL: 0-minute label leaked'; exit 1; fi

          fetch_page http://127.0.0.1:3000/vi/library/sn-3-15 /tmp/sn315.html
          grep -Fq 'chưa có bản Việt Thích Minh Châu' /tmp/sn315.html
          grep -Fq 'không tự chuyển sang bản dịch khác' /tmp/sn315.html

          fetch_page http://127.0.0.1:3000/vi/library/sn-22-59-anattalakkhana /tmp/sn2259.html
          grep -Fq 'Kinh Vô Ngã Tướng' /tmp/sn2259.html

          fetch_page http://127.0.0.1:3000/vi/library/mn-21-kakacupama /tmp/mn21.html
          echo 'DN + SN DATA-FIRST CURRENT MAIN SMOKE PASS'

      - name: Commit verified DN + SN corpus checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/catalog/suttas.json \
            data/catalog/audio.json \
            data/content/dn.vi.json \
            data/catalog/discovery-sn.json \
            data/catalog/discovery-sn-report.json \
            data/catalog/discovery-sn-suttaplex.json \
            data/catalog/discovery-sn-suttaplex-report.json \
            data/catalog/discovery-sn-suttaplex-en.json \
            data/catalog/discovery-sn-suttaplex-en-report.json \
            data/catalog/sn-materialization-preview.json \
            data/catalog/sn-materialization-report.json \
            data/exports
          if git diff --cached --quiet; then
            echo 'No DN/SN corpus changes to commit.'
            exit 0
          fi
          git commit -m 'data: materialize DN34 + full SN corpus on current main'
          git push origin HEAD:feature/sn-data-first-current-main
