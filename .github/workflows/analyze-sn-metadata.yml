name: Analyze SN metadata gaps

on:
  push:
    branches:
      - feature/sn-canonical-discovery
    paths:
      - '.github/workflows/analyze-sn-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sn-canonical-discovery
          fetch-depth: 0

      - name: Analyze metadata coverage without network calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data=json.loads(Path('data/catalog/discovery-sn-suttaplex.json').read_text(encoding='utf-8'))
          items=data['items']
          no_vi=[]
          for x in items:
              if x.get('preferredVi') is None:
                  ref=x['canonicalRef']
                  no_vi.append({
                      'canonicalRef': ref,
                      'isRange': '-' in ref,
                      'originalTitle': x.get('originalTitle'),
                      'translatedTitle': x.get('translatedTitle'),
                      'acronym': x.get('acronym'),
                  })
          report={
              'collection':'SN',
              'canonicalLeafCount':len(items),
              'paliTitleCount':sum(bool(x.get('originalTitle')) for x in items),
              'translatedTitleCount':sum(bool(x.get('translatedTitle')) for x in items),
              'preferredViCount':sum(x.get('preferredVi') is not None for x in items),
              'noPreferredViCount':len(no_vi),
              'noPreferredViRangeCount':sum(x['isRange'] for x in no_vi),
              'noPreferredViRefs':no_vi,
          }
          Path('data/catalog/discovery-sn-metadata-analysis.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit analysis
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/catalog/discovery-sn-metadata-analysis.json)" ]; then
            echo 'Analysis unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog/discovery-sn-metadata-analysis.json
          git commit -m 'data: analyze SN metadata gaps'
          git push origin HEAD:feature/sn-canonical-discovery
